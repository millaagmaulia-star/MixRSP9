name: Build Android APK

on:
  push:
    branches: [ "github/workflows/build-apk.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kode sumber
      uses: actions/checkout@v4

    - name: Ekstrak file ZIP proyek
      run: |
        unzip -q audiomaster-pro.zip -d proyek_ekstrak
        cd proyek_ekstrak
        if [ ! -f "gradlew" ]; then
          SUBDIR=$(find . -maxdepth 2 -name "gradlew" -printf "%h\n" | head -n 1)
          if [ -n "$SUBDIR" ]; then
            mv "$SUBDIR"/* .
          fi
        fi

    - name: Siapkan Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Beri izin akses Gradle
      working-directory: ./proyek_ekstrak
      run: chmod +x gradlew

    - name: Build Debug APK
      working-directory: ./proyek_ekstrak
      run: ./gradlew assembleDebug

    - name: Unggah hasil APK
      uses: actions/upload-artifact@v4
      with:
        name: AudioMaster-Pro-APK
        path: proyek_ekstrak/**/build/outputs/apk/debug/*.apk
