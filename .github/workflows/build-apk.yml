name: Build Android APK

on:
  push:
    branches: [ "github/workflows/build-apk.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kode sumber
      uses: actions/checkout@v4

    - name: Ekstrak file ZIP proyek
      run: |
        unzip -q audiomaster-pro.zip -d proyek_ekstrak

    - name: Siapkan Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Siapkan Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Konversi Web ke Android APK (Capacitor)
      run: |
        cd proyek_ekstrak
        if [ $(ls -1 | wc -l) -eq 1 ] && [ -d "$(ls -1)" ]; then
          cd "$(ls -1)"
        fi
        
        if [ -f "package.json" ]; then
          npm install --legacy-peer-deps
          npm run build
        fi
        
        WEB_DIR="dist"
        if [ -d "build" ]; then WEB_DIR="build"; fi
        if [ -d "www" ]; then WEB_DIR="www"; fi
        if [ ! -d "$WEB_DIR" ]; then WEB_DIR="."; fi
        
        npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
        npx cap init "AudioMaster Pro" "com.audiomaster.pro" --web-dir="$WEB_DIR"
        npx cap add android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Unggah hasil APK
      uses: actions/upload-artifact@v4
      with:
        name: AudioMaster-Pro-APK
        path: proyek_ekstrak/**/android/app/build/outputs/apk/debug/*.apk
